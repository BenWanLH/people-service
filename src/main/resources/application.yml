spring:
  application:
    name: people-service
  grpc:
    server:
      port: 9090
    client:
      channel:
        movies:
          target: static://localhost:9091
  datasource:
    url: jdbc:h2:file:./data/people
  jpa:
    hibernate:
      ddl-auto: validate
  graphql:
    graphiql:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8081

photo:
  directory: ./data/photo